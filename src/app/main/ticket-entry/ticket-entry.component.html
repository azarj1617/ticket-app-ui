<div style="position: absolute;transform: translate(40vw,-5vh);z-index: 10;">
        <div class="col-md-12">
            <app-alerts [isAlert]="alert" [alertData]="alertData"></app-alerts>
        </div>
    </div>
<div class="row">
    <div class="col-md-8">
          <div class="table-scroll">
            <table class="table table-striped text-left">
                <thead>
                    <td>S.No</td>
                    <td>Item Name</td>
                    <td>Description</td>
                    <td>MRP</td>
                    <td>Selling Price</td>
                    <td>Save Price</td>
                    <td>Actions</td>
                </thead>
                <tbody>
                    <ng-container  *ngIf="ticketItemsList?.length>0">
                    <tr *ngFor="let ticketItem of ticketItemsList;let i=index">
                        <td>{{i+1}}</td>
                        <td>{{ticketItem?.itemName}}</td>
                        <td>{{ticketItem?.description}}</td>
                        <td>{{ticketItem?.mrp}}</td>
                        <td>{{ticketItem?.sellingPrice}}</td>
                        <td>{{ticketItem?.savePrice}}</td>
                        <td>
                        <span>
                            <button class="btn btn-sm btn-secondary" (click)="editFun(ticketItem,i)"><i class="far fa-edit"></i></button>
                            <button class="btn btn-sm btn-danger ms-1" (click)="deleteFun(i)"><i class="fas fa-trash-alt"></i></button>                            
                        </span>
                    </td>
                    </tr>
                    </ng-container>
                    <tr *ngIf="ticketItemsList?.length==0">
                        <td colspan="7" style="text-align: center;"><span>No Records</span></td>
                    </tr>
                </tbody>
            </table>
            </div> 
        <div class="row" style="width:70%;position: absolute;bottom: 2px;background: #fff;">
            
            <div class="d-flex justify-content-end">
                    <div class="row justify-content-center me-2">
                        <div class="col-md-12">
                            <select class="form-select" [(ngModel)]="selectedDesign">
                                <option value="1">Template 1</option>
                                <option value="2">Template 2</option>
                            </select>
                        </div>
                    </div>
                    <button class="btn btn-info" [disabled]="ticketItemsList?.length==0" (click)="printFun('download')">Download</button>
                    <button class="btn btn-info ms-2" [disabled]="ticketItemsList?.length==0" (click)="clearAll()">Clear All</button>
                    <button class="btn btn-info ms-2" [disabled]="ticketItemsList?.length==0" (click)="printFun()">Print</button>
            </div>
        </div>         
    </div>
    <div class="col-md-4">
        <div class="ps-3 pe-3">
            <form  [formGroup]="ticketForm">
                <div>
                    <label for="itemName" class="col-sm-4 col-form-label">Item Name</label>
                    <input class="form-control" type="text" placeholder="Enter Item Name..." 
                    formControlName="itemName" [ngClass]="{'invalid-data':validateFunc('itemName')}">
                </div>
                 <div>
                    <label for="description" class="col-sm-4 col-form-label">Description</label>
                    <input class="form-control" type="text" placeholder="Enter Description..."
                    formControlName="description">
                </div>
                <div>
                    <label for="mrp" class="col-sm-4 col-form-label">MRP</label>
                    <input class="form-control" type="text" placeholder="Enter MRP..." 
                    formControlName="mrp" [ngClass]="{'invalid-data':validateFunc('mrp')}">
                </div>
                <div>
                    <label for="sellingPrice" class="col-sm-4 col-form-label">Selling Price</label>
                    <input class="form-control" type="text" placeholder="Enter Selling Price..."
                    formControlName="sellingPrice" [ngClass]="{'invalid-data':validateFunc('sellingPrice')}">
                </div>
                <div>
                    <label for="savePrice" class="col-sm-4 col-form-label">Save Price</label>
                    <input class="form-control" type="text" placeholder="Enter Save Price..." 
                    formControlName="savePrice">
                </div>
                <div class="mt-3">
                    <div class="d-flex justify-content-end">
                        <button class="btn btn-sm btn-success" (click)="ticketItemSave()">Save</button>
                        <button class="btn btn-sm btn-success ms-2" (click)="resetForm()">Reset</button>
                    </div>
                   
                </div>
            </form>
        </div>
    </div>
</div>
